name: Weekly Data Update

on:
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: weekly-data-update
  cancel-in-progress: false

jobs:
  update-osm-data:
    name: Update OSM Data
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch fresh OSM data
        timeout-minutes: 25
        run: pnpm exec tsx scripts/fetch-overpass-toilets.ts

      - name: Refresh OSM records
        run: pnpm exec tsx scripts/update-osm-data.ts

      - name: Refresh municipal open data
        timeout-minutes: 4
        run: pnpm data:municipal

      - name: Refresh Hannover and rebuild tiles
        timeout-minutes: 4
        run: pnpm data:hannover

      # PRs created with GITHUB_TOKEN do not trigger other PR workflows.
      - name: Validate updated data and app
        run: pnpm quality

      - name: Create or update data pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "data: refresh OSM and municipal toilets"
          title: "data: weekly OSM and municipal update"
          body: |
            Refresh accessible OSM toilets, Berlin, Hamburg, Rostock, Oldenburg, Münster and Hannover, then rebuild map tiles.
            Existing location IDs and specialist care data are preserved.

            Published source snapshots contain complete, validated responses.
            Type checking, lint and automated tests passed before this PR was created.

            Please review coverage and location changes before merging.
          base: ${{ github.event.repository.default_branch }}
          branch: data/weekly-update
          delete-branch: true
          add-paths: src/data/
