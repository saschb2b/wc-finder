name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test --runInBand

      - name: Test care directory importer
        run: pnpm test:care

      - name: Test embedded map
        run: pnpm test:map

      - name: Changelog has notes for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm exec tsx scripts/release-notes.ts "${{ github.ref_name }}" --check

  build-apk:
    name: Build signed APK
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check Expo credentials are configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Set the EXPO_TOKEN repository secret before building."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 23.2.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK on this runner
        timeout-minutes: 45
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/wc-finder-build
          GRADLE_OPTS: -Dorg.gradle.console=plain -Dorg.gradle.workers.max=2
        run: |
          eas build --platform android --profile preview --local \
            --non-interactive --freeze-credentials --verbose-logs \
            --output "$RUNNER_TEMP/wc-finder.apk"

      - name: Verify installer
        run: |
          test -s "$RUNNER_TEMP/wc-finder.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$RUNNER_TEMP/wc-finder.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$RUNNER_TEMP/wc-finder.apk" > "$RUNNER_TEMP/apk-info.txt"
          grep -q "package: name='com.saschb2b.wcfinder'" "$RUNNER_TEMP/apk-info.txt"
          grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)' "$RUNNER_TEMP/apk-info.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wc-finder-apk
          path: ${{ runner.temp }}/wc-finder.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm exec tsx scripts/release-notes.ts "${{ github.ref_name }}" > "$RUNNER_TEMP/release-notes.md"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/wc-finder.apk
          fail_on_unmatched_files: true
          name: WC Finder ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        env:
          BUILD_REF: ${{ github.ref_name }}
        run: |
          echo "## Signed APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Ref: $BUILD_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "Download wc-finder-apk from this run's Artifacts section and unzip it to install wc-finder.apk." >> "$GITHUB_STEP_SUMMARY"
          echo "Version tags also attach wc-finder.apk directly to the GitHub release." >> "$GITHUB_STEP_SUMMARY"
